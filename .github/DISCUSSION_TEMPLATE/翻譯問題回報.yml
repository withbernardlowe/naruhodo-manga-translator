# 「翻譯問題回報」分類的表單。檔名要跟分類的 slug 一樣（src/ui/links.ts 的 PROBLEM_REPORT_CATEGORY），
# GitHub 只讀 main 上的這個檔。side panel 的「回報翻譯問題」把 Problem Report 複製到剪貼簿後打開這裡。
# 報告只有除錯用的數字，沒有對白：哪一頁、哪裡有問題由讀者自己寫。
title: '[翻譯問題] '
body:
  - type: markdown
    attributes:
      value: |
        謝謝你回報！按下外掛的「回報翻譯問題」後，**報告已經複製到剪貼簿**了，請貼到最下面的「報告」欄位。

        報告是給開發者除錯用的：每一句在頁面上的位置、辨識的數字、頁面網址和外掛的設定，**沒有對白、譯文，也沒有圖片**。所以請在下面用你自己的話告訴我們是哪一頁、哪裡有問題。

        **送出後這篇討論是公開的。**
  - type: dropdown
    id: kind
    attributes:
      label: 問題類型
      options:
        - 沒偵測到文字
        - 框的位置不對
        - 原文讀錯
        - 翻譯不對
        - 排版或顯示問題
        - 其他
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: 哪一頁、哪個位置
      description: 照側邊欄由上往下數是第幾頁，再說是頁面上哪個位置。
      placeholder: 第 2 頁，右上角的對話框
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 哪裡怪、應該是什麼
      description: 例如讀錯或翻錯成什麼、你覺得應該是什麼，或是畫面哪裡看起來怪。引用原文時只寫有問題的那一句就好。
  - type: textarea
    id: report
    attributes:
      label: 報告
      description: 在這裡貼上（Ctrl+V／⌘V）。如果剪貼簿裡已經是別的東西，回到外掛的側邊欄按「再複製一次」。
    validations:
      required: true
